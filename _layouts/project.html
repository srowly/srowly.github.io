---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {% unless page.hide_header_image %}
    <img
      src="{{ page.image_url | relative_url }}"
      alt="{{ page.title | escape }}"
      style="width: 100%; height: 320px; object-fit: cover; object-position: center; border-radius: 10px; margin-bottom: 28px; display: block;"
    >
    {% endunless %}

    {{ content }}

  </div>

</article>
